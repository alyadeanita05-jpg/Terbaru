
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Capstone Tracker</title>
  <meta name="theme-color" content="#27293d" />
  <meta name="description" content="Organize Your Tasks, Track Your Progress, Achieve Together." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'] },
        colors: {
          pink: { 50: '#f7f5ef', 100: '#efece3', 200: '#dcebef', 300: '#b2d4dd', 400: '#7fa9b8', 500: '#33364f', 600: '#27293d', 700: '#1f2133', 800: '#191b29', 900: '#13141f', 950: '#0c0d14' },
          navy: { 500: '#33364f', 600: '#27293d', 700: '#1f2133' },
          cream: { 50: '#faf8f4', 100: '#f0ede5', 200: '#e6e2d6' },
          lav: { 50: '#f1f7f9', 100: '#e3eff3', 200: '#cfe3ea', 300: '#b2d4dd', 400: '#8fbac7', 500: '#5f98aa', 600: '#3f7285', 700: '#2e5666' },
        },
      } },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; background: #f0ede5; -webkit-tap-highlight-color: transparent; }
    body { overflow-x: hidden; }
    textarea { resize: vertical; }
    button { transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease, border-color .15s ease; }
    button:active:not(:disabled) { transform: scale(.97); }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fade .22s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .pop-in { animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    .slide-up { animation: slideup .26s ease-out; }
    @keyframes slideup { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .slide-right { animation: slideright .22s ease-out; }
    @keyframes slideright { from { transform: translateX(-100%); } to { transform: none; } }
    .lift { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .lift:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -12px rgba(39, 41, 61, .28); border-color: #b2d4dd; }
    .skeleton { background: linear-gradient(90deg, #e6e2d6 25%, #f5f3ec 37%, #e6e2d6 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; border-radius: 12px; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: #27293d; animation: bounce 1.1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
    .hero-bg { background: radial-gradient(120% 140% at 0% 0%, #dcebef 0%, #f6f4ee 60%, #ffffff 100%); }
    .safe-b { padding-bottom: env(safe-area-inset-bottom, 0px); }
    input:focus, select:focus, textarea:focus { outline: none; }
    .page-in { animation: fade .25s ease-out; }
    .kcol.over { background: #dcebef; outline: 2px dashed #7fa9b8; }
    [draggable=true] { cursor: grab; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body class="text-gray-800 antialiased">
  <div id="root"></div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
