<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capstone Tracker</title>
  <meta name="description" content="Organize Your Tasks, Track Your Progress, Achieve Together." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; background: #f6f6f8; }
    textarea { resize: vertical; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fade .18s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="text-gray-800 antialiased">
  <div id="root"></div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
